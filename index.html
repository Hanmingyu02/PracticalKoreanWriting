<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>실용글쓰기 연습</title>
  <link rel="stylesheet" href="style.css?v=notes-1">
  <script src="questions.js?v=notes-1" defer></script>
  <script src="app.js?v=notes-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#question">문제로 바로가기</a>
  <header><h1>실용글쓰기 연습</h1><span>개인 학습용</span></header>
  <main id="study">
    <div class="workspace">
      <aside><h2 class="section-label" id="category-label">영역 선택</h2><select id="category-select" aria-labelledby="category-label"></select><nav id="categories" aria-label="학습 영역"></nav></aside>
      <section class="quiz-column" aria-label="문제 풀기">
        <div class="toolbar"><div class="tabs" role="group" aria-label="학습 모드"><button id="all-mode" class="active">문제 풀기</button><button id="wrong-mode">오답 노트 <span id="wrong-count">0</span></button><button id="notes-mode">학습노트</button></div><button class="text-button" id="reset">기록 초기화</button></div>
        <section id="study-notes" aria-labelledby="notes-title" hidden>
          <h2 id="notes-title">학습노트</h2>
          <label for="notes-search">용어 또는 다듬은 말 검색</label>
          <input id="notes-search" type="search" placeholder="예: 거버넌스, 협치" autocomplete="off">
          <p id="notes-count" role="status"></p>
          <p id="notes-empty" hidden>검색 결과가 없습니다.</p>
          <table id="notes-table"><caption class="visually-hidden">선택한 영역의 용어와 다듬은 말</caption><thead><tr><th scope="col">용어</th><th scope="col">다듬은 말</th></tr></thead><tbody id="notes-rows"></tbody></table>
        </section>
        <article class="quiz-card" aria-labelledby="question">
          <div class="card-top"><span id="category" class="badge"></span><span class="random-label">무작위 출제</span></div>
          <p class="question-label">아래 용어를 다듬은 말로 바꿔 적으세요.</p>
          <h2 id="question" tabindex="-1"></h2>
          <p id="empty-description" hidden></p>
          <form id="answer-form" hidden>
            <label for="answer-input">다듬은 말</label>
            <p id="answer-help">여러 답 중 하나만 적어도 됩니다. 띄어쓰기 차이는 무시합니다.</p>
            <div class="answer-row"><input id="answer-input" type="text" placeholder="답을 입력하세요" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="send" required aria-describedby="answer-help"><button id="submit-answer" class="primary" type="submit">보내기</button></div>
          </form>
          <div id="feedback" aria-live="polite"></div>
          <div class="card-bottom"><span id="progress"></span><button id="next" class="primary" disabled>다음 문제 <span aria-hidden="true">→</span></button></div>
        </article>
        <dl class="stats" aria-label="학습 기록"><div><dt>푼 문제</dt><dd id="answered">0<small>문제</small></dd></div><div><dt>정답률</dt><dd id="accuracy">0<small>%</small></dd></div><div><dt>연속 정답</dt><dd id="streak">0<small>문제</small></dd></div></dl>
        <p class="storage-note">학습 기록은 현재 브라우저에 저장됩니다.</p>
      </section>
    </div>
  </main>
</body>
</html>
