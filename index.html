<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>실용글쓰기 연습</title>
  <link rel="stylesheet" href="style.css?v=practice-1">
  <script src="questions.js?v=practice-1" defer></script>
  <script src="app.js?v=practice-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#question">문제로 바로가기</a>
  <header><h1>실용글쓰기 연습</h1><span>개인 학습용</span></header>
  <main id="study">
    <div class="workspace">
      <aside><h2 class="section-label">영역 선택</h2><nav id="categories" aria-label="학습 영역"></nav></aside>
      <section class="quiz-column" aria-label="문제 풀기">
        <div class="toolbar"><div class="tabs" role="group" aria-label="문제 모드"><button id="all-mode" class="active">문제 풀기</button><button id="wrong-mode">오답 노트 <span id="wrong-count">0</span></button></div><button class="text-button" id="reset">기록 초기화</button></div>
        <article class="quiz-card" aria-labelledby="question">
          <div class="card-top"><span id="category" class="badge"></span><span class="random-label">무작위 출제</span></div>
          <p class="question-label">알맞은 답을 선택하세요.</p>
          <h2 id="question" tabindex="-1"></h2>
          <p id="empty-description" hidden></p>
          <div id="options" class="options"></div>
          <div id="feedback" aria-live="polite"></div>
          <div class="card-bottom"><span id="progress"></span><button id="next" class="primary" disabled>다음 문제 <span aria-hidden="true">→</span></button></div>
        </article>
        <dl class="stats" aria-label="학습 기록"><div><dt>푼 문제</dt><dd id="answered">0<small>문제</small></dd></div><div><dt>정답률</dt><dd id="accuracy">0<small>%</small></dd></div><div><dt>연속 정답</dt><dd id="streak">0<small>문제</small></dd></div></dl>
        <p class="storage-note">학습 기록은 현재 브라우저에 저장됩니다.</p>
      </section>
    </div>
  </main>
</body>
</html>
